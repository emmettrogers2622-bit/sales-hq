<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Intelligence — Quad Sales HQ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#08090d;--surface:rgba(255,255,255,0.03);--surface2:rgba(255,255,255,0.06);
--border:rgba(255,255,255,0.08);--text:#eaedf3;--text2:rgba(234,237,243,0.6);
--red:#E31837;--cyan:#00AEEF;--yellow:#FFD100;--green:#00C853;
--glass:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.1);
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Playfair Display',serif}
.mono{font-family:'JetBrains Mono',monospace}

/* Background effects */
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;
background:radial-gradient(ellipse at 20% 20%,rgba(0,174,239,0.04) 0%,transparent 50%),
radial-gradient(ellipse at 80% 80%,rgba(227,24,55,0.03) 0%,transparent 50%);
pointer-events:none;z-index:0}

.container{max-width:1440px;margin:0 auto;padding:24px;position:relative;z-index:1}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;margin-bottom:32px;border-bottom:1px solid var(--border)}
.header h1{font-size:28px;background:linear-gradient(135deg,var(--cyan),var(--text));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .back-link{color:var(--cyan);text-decoration:none;font-size:14px;opacity:0.7;transition:opacity 0.2s}
.header .back-link:hover{opacity:1}
.header-actions{display:flex;gap:12px}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:13px;font-family:'Inter',sans-serif;transition:all 0.2s;display:flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface2);border-color:var(--glass-border)}
.btn-cyan{border-color:rgba(0,174,239,0.3);color:var(--cyan)}
.btn-cyan:hover{background:rgba(0,174,239,0.1)}

/* Dashboard */
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:16px;padding:20px;position:relative;overflow:hidden;transition:transform 0.2s}
.stat-card:hover{transform:translateY(-2px)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat-card.cyan::before{background:linear-gradient(90deg,var(--cyan),transparent)}
.stat-card.green::before{background:linear-gradient(90deg,var(--green),transparent)}
.stat-card.yellow::before{background:linear-gradient(90deg,var(--yellow),transparent)}
.stat-card.red::before{background:linear-gradient(90deg,var(--red),transparent)}
.stat-label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:8px}
.stat-value{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:600}
.stat-value.cyan{color:var(--cyan)}
.stat-value.green{color:var(--green)}
.stat-value.yellow{color:var(--yellow)}
.stat-value.red{color:var(--red)}
.stat-sub{font-size:12px;color:var(--text2);margin-top:4px}

/* Priority breakdown mini bars */
.priority-bars{display:flex;gap:4px;margin-top:8px}
.priority-bars .bar{height:6px;border-radius:3px;flex:1;opacity:0.3;transition:opacity 0.2s}
.priority-bars .bar.active{opacity:1}

/* Filter bar */
.filter-bar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px;align-items:center;padding:16px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:12px}
.filter-group{display:flex;align-items:center;gap:8px}
.filter-group label{font-size:12px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text2)}
select,input[type="text"]{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.2s}
select:focus,input:focus{border-color:var(--cyan)}
select option{background:#1a1b23;color:#eaedf3}
input[type="text"]{width:220px}
.filter-spacer{flex:1}
.view-toggle{display:flex;gap:4px;background:var(--surface);border-radius:8px;padding:3px;border:1px solid var(--border)}
.view-toggle button{padding:6px 12px;border:none;background:transparent;color:var(--text2);cursor:pointer;border-radius:6px;font-size:12px;transition:all 0.2s}
.view-toggle button.active{background:var(--surface2);color:var(--text)}
.results-count{font-size:13px;color:var(--text2);margin-bottom:16px}

/* Card grid */
.accounts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.accounts-grid.table-view{grid-template-columns:1fr}

/* Account card */
.account-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:16px;padding:20px;cursor:pointer;transition:all 0.3s ease;position:relative;overflow:hidden}
.account-card:hover{border-color:rgba(255,255,255,0.15);transform:translateY(-1px);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.account-card.expanded{grid-column:1/-1}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.company-name{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;line-height:1.3}
.status-badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap}
.status-badge.active{background:rgba(0,200,83,0.15);color:var(--green);border:1px solid rgba(0,200,83,0.3)}
.status-badge.prospect{background:rgba(0,174,239,0.15);color:var(--cyan);border:1px solid rgba(0,174,239,0.3)}
.status-badge.winback{background:rgba(255,209,0,0.15);color:var(--yellow);border:1px solid rgba(255,209,0,0.3)}
.card-location{font-size:13px;color:var(--text2);margin-bottom:8px}
.card-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.meta-tag{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--text2);font-family:'JetBrains Mono',monospace}
.meta-tag.industry{border-left:2px solid var(--cyan)}
.meta-tag.revenue{border-left:2px solid var(--green)}
.meta-tag.employees{border-left:2px solid var(--yellow)}
.meta-tag.ttm{border-left:2px solid var(--red)}
.card-description{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:12px}
.priority-stars{display:flex;gap:2px}
.priority-stars .star{width:16px;height:16px;color:rgba(255,209,0,0.2)}
.priority-stars .star.filled{color:var(--yellow)}

/* Expanded details */
.card-details{max-height:0;overflow:hidden;transition:max-height 0.4s ease}
.account-card.expanded .card-details{max-height:500px}
.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-top:16px;border-top:1px solid var(--border);margin-top:12px}
.detail-item{font-size:13px}
.detail-label{color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.detail-value{color:var(--text)}
.detail-value.product{color:var(--cyan);font-weight:500}
.detail-value.case-study{color:var(--yellow);font-weight:500}
.quad-fit{grid-column:1/-1;font-size:13px;line-height:1.5;color:var(--text2)}
.quad-fit strong{color:var(--text)}
.direct-mail-indicator{display:inline-flex;align-items:center;gap:4px}
.dm-dot{width:8px;height:8px;border-radius:50%}
.dm-dot.likely{background:var(--green)}
.dm-dot.possible{background:var(--yellow)}
.dm-dot.unlikely{background:var(--red)}

/* Table view overrides */
.table-view .account-card{border-radius:8px;padding:14px 20px}
.table-view .card-header{margin-bottom:0}
.table-view .company-name{font-size:15px}
.table-view .card-meta,.table-view .card-description{display:none}
.table-view .account-card.expanded .card-meta,.table-view .account-card.expanded .card-description{display:flex}
.table-view .account-card.expanded .card-description{display:block}
.table-view .card-header{display:grid;grid-template-columns:2fr 100px 120px 100px 100px 80px;align-items:center;gap:12px}
.table-header{display:none;padding:12px 20px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);
grid-template-columns:2fr 100px 120px 100px 100px 80px;gap:12px;cursor:pointer}
.table-view~.table-header,.table-view+.table-header{display:grid}
.table-header span:hover{color:var(--text)}
.table-header span.sorted{color:var(--cyan)}
.th-sort{display:inline-block;margin-left:4px;font-size:10px}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.account-card{animation:fadeIn 0.3s ease both}
.accounts-grid .account-card:nth-child(1){animation-delay:0.02s}
.accounts-grid .account-card:nth-child(2){animation-delay:0.04s}
.accounts-grid .account-card:nth-child(3){animation-delay:0.06s}
.accounts-grid .account-card:nth-child(4){animation-delay:0.08s}
.accounts-grid .account-card:nth-child(5){animation-delay:0.1s}

/* Glow effects */
.account-card.priority-5::after{content:'';position:absolute;top:-1px;right:-1px;width:60px;height:60px;
background:radial-gradient(circle,rgba(255,209,0,0.15),transparent 70%);pointer-events:none}
.account-card.priority-4::after{content:'';position:absolute;top:-1px;right:-1px;width:40px;height:40px;
background:radial-gradient(circle,rgba(0,174,239,0.1),transparent 70%);pointer-events:none}

/* Responsive */
@media(max-width:768px){
.accounts-grid{grid-template-columns:1fr}
.filter-bar{flex-direction:column;align-items:stretch}
.dashboard{grid-template-columns:repeat(2,1fr)}
.details-grid{grid-template-columns:1fr}
}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.15)}

/* Export toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:#000;padding:12px 24px;border-radius:12px;font-weight:600;font-size:14px;transform:translateY(100px);opacity:0;transition:all 0.3s ease;z-index:1000}
.toast.show{transform:translateY(0);opacity:1}

/* Brand logos */
.brand-logo{width:32px;height:32px;border-radius:6px;object-fit:contain;background:#fff;padding:2px;flex-shrink:0}
.brand-logo-lg{width:64px;height:64px;border-radius:12px;object-fit:contain;background:#fff;padding:4px}
.brand-logo.err{display:none}
.card-header-left{display:flex;align-items:center;gap:12px}

/* Meeting Prep Overlay */
.prep-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);z-index:3000;display:none;justify-content:center;align-items:flex-start;padding:30px 20px;overflow-y:auto}
.prep-overlay.open{display:flex}
.prep-doc{background:var(--bg);border:1px solid var(--glass-border);border-radius:20px;width:100%;max-width:800px;padding:0;animation:fadeIn .25s ease;position:relative}
.prep-doc-header{padding:24px 32px;background:linear-gradient(135deg,rgba(227,24,55,.1),rgba(0,174,239,.1));border-bottom:1px solid var(--border);border-radius:20px 20px 0 0;display:flex;align-items:center;justify-content:space-between}
.prep-doc-body{padding:28px 32px}
.prep-section{margin-bottom:24px}
.prep-section-title{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.prep-section-title::before{content:'';width:3px;height:16px;background:var(--cyan);border-radius:2px}
.prep-item{padding:10px 14px;background:var(--glass);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;font-size:.8rem;line-height:1.6;color:var(--text2)}
.prep-item strong{color:var(--text)}
.prep-item .label{color:var(--yellow);font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
.prep-highlight{border-left:3px solid var(--cyan);padding-left:14px}
.prep-actions{display:flex;gap:10px;padding:20px 32px;border-top:1px solid var(--border)}
.prep-actions button{padding:10px 20px;border-radius:10px;border:none;font-size:.8rem;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;transition:.2s}
@media print{.prep-overlay{position:static;background:#fff;padding:0}.prep-doc{box-shadow:none;border:none;max-width:100%}.prep-actions,.prep-doc-header button{display:none!important}.prep-doc-body{color:#000}.prep-section-title{color:#E31837}.prep-item{border-color:#ddd;background:#f9f9f9;color:#333}}

/* Account Detail Modal */
.acct-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:2000;display:none;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto}
.acct-modal-overlay.open{display:flex}
.acct-modal{background:var(--bg);border:1px solid var(--glass-border);border-radius:20px;width:100%;max-width:720px;max-height:90vh;overflow-y:auto;position:relative;animation:fadeIn 0.25s ease}
.acct-modal-header{padding:24px 28px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:1;border-radius:20px 20px 0 0}
.acct-modal-header .close-btn{background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer;padding:4px 8px;transition:.2s;line-height:1}
.acct-modal-header .close-btn:hover{color:var(--text)}
.acct-modal-body{padding:24px 28px}
.acct-section{margin-bottom:24px}
.acct-section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:10px;font-weight:600}
.acct-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acct-detail-item .label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.acct-detail-item .value{font-size:14px;color:var(--text);font-weight:500;margin-top:2px}
.acct-detail-item .value.cyan{color:var(--cyan)}
.acct-detail-item .value.yellow{color:var(--yellow)}
.acct-detail-item .value.green{color:var(--green)}
.acct-detail-item .value.red{color:var(--red)}
.notes-area{width:100%;min-height:120px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:14px;font-family:'Inter',sans-serif;font-size:13px;line-height:1.6;resize:vertical;outline:none;transition:border-color .2s}
.notes-area:focus{border-color:var(--cyan)}
.notes-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.notes-meta .saved{font-size:11px;color:var(--green);opacity:0;transition:.3s}
.notes-meta .saved.show{opacity:1}
.notes-meta .count{font-size:11px;color:var(--text2)}
.note-entry{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.note-entry .note-date{font-size:10px;color:var(--text2);margin-bottom:4px;font-family:'JetBrains Mono',monospace}
.note-entry .note-text{font-size:13px;color:var(--text);line-height:1.5;white-space:pre-wrap}
.note-entry .note-del{background:none;border:none;color:var(--text3);font-size:.7rem;cursor:pointer;float:right;opacity:0;transition:.15s}
.note-entry:hover .note-del{opacity:1}
.note-entry .note-del:hover{color:var(--red)}
.add-note-row{display:flex;gap:8px;margin-top:10px}
.add-note-row .notes-area{min-height:60px;flex:1}
.add-note-btn{background:linear-gradient(135deg,var(--red),var(--cyan));border:none;color:#fff;padding:10px 20px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;transition:.2s;white-space:nowrap;align-self:flex-end}
.add-note-btn:hover{opacity:.85;transform:translateY(-1px)}
.has-notes::before{content:'📝';position:absolute;top:8px;right:40px;font-size:12px}
.edit-field{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color .2s}
.edit-field:focus{border-color:var(--cyan)}
.edit-field.sm{padding:6px 8px;font-size:12px}
.edit-select{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:6px 10px;font-size:12px;outline:none;font-family:'Inter',sans-serif;cursor:pointer}
.edit-select option{background:#1a1b23;color:#eaedf3}
.edit-select:focus{border-color:var(--cyan)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field-row.full{grid-template-columns:1fr}
.field-group{display:flex;flex-direction:column;gap:4px}
.field-group .label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);font-weight:600}
.edit-textarea{width:100%;min-height:60px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px;font-family:'Inter',sans-serif;font-size:13px;line-height:1.5;resize:vertical;outline:none;transition:border-color .2s}
.edit-textarea:focus{border-color:var(--cyan)}
.section-divider{border:none;border-top:1px solid var(--border);margin:20px 0}
.pipe-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:1px}
.pipe-badge.now{background:rgba(227,24,55,0.2);color:var(--red);border:1px solid rgba(227,24,55,0.4)}
.pipe-badge.active{background:rgba(255,209,0,0.15);color:var(--yellow);border:1px solid rgba(255,209,0,0.3)}
.pipe-badge.reset{background:rgba(0,174,239,0.15);color:var(--cyan);border:1px solid rgba(0,174,239,0.3)}
.pipe-badge.reengage{background:rgba(255,255,255,0.08);color:var(--text2);border:1px solid var(--border)}
.has-edits::after{content:'✎';position:absolute;top:8px;right:56px;font-size:11px;color:var(--cyan)}

/* Top Opps */
.opp-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:16px;padding:20px;position:relative;overflow:hidden;transition:all 0.3s}
.opp-card:hover{border-color:rgba(255,255,255,0.2);transform:translateY(-2px)}
.opp-card .opp-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.opp-card .opp-name{font-family:'Playfair Display',serif;font-size:18px;font-weight:600}
.opp-card .opp-urgency{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:1px}
.opp-urgency.now{background:rgba(227,24,55,0.2);color:var(--red);border:1px solid rgba(227,24,55,0.4)}
.opp-urgency.active{background:rgba(255,209,0,0.15);color:var(--yellow);border:1px solid rgba(255,209,0,0.3)}
.opp-urgency.reset{background:rgba(0,174,239,0.15);color:var(--cyan);border:1px solid rgba(0,174,239,0.3)}
.opp-urgency.reengage{background:rgba(255,255,255,0.08);color:var(--text2);border:1px solid var(--border)}
.opp-money{display:flex;gap:16px;margin-bottom:12px;font-family:'JetBrains Mono',monospace;font-size:13px}
.opp-money span{display:flex;flex-direction:column;gap:2px}
.opp-money .label{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text2);font-family:'Inter',sans-serif}
.opp-money .val{font-weight:600}
.opp-money .val.green{color:var(--green)}
.opp-money .val.cyan{color:var(--cyan)}
.opp-status{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:10px;border-left:2px solid var(--border);padding-left:12px}
.opp-action{font-size:12px;color:var(--text);line-height:1.5;background:rgba(0,174,239,0.06);border:1px solid rgba(0,174,239,0.15);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.opp-action strong{color:var(--cyan)}
.opp-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:11px}
.opp-meta .tag{padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--text2)}
.opp-kpis{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opp-kpis .kpi{font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(255,209,0,0.1);color:var(--yellow);border:1px solid rgba(255,209,0,0.2)}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div>
<h1>Account Intelligence</h1>
</div>
<div class="header-actions">
<a href="accounts-news.html" class="btn btn-cyan" style="text-decoration:none">📰 Account News</a>
<button class="btn btn-cyan" onclick="exportCSV()">📋 Export CSV</button>
</div>
</div>

<div class="dashboard" id="dashboard"></div>

<!-- TOP OPPORTUNITIES -->
<div style="margin-bottom:32px">
<h2 style="font-size:22px;margin-bottom:4px;background:linear-gradient(135deg,var(--red),var(--yellow));-webkit-background-clip:text;-webkit-text-fill-color:transparent">🔥 Top Opportunities Pipeline</h2>
<p style="font-size:13px;color:var(--text2);margin-bottom:16px">Active deals + high-value targets — <span class="mono" style="color:var(--green)">$3.8M+ revenue</span> / <span class="mono" style="color:var(--cyan)">$4.4M+ reach</span></p>
<div id="topOppsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px"></div>
</div>

<div class="filter-bar">
<div class="filter-group">
<label>Status</label>
<select id="filterStatus" onchange="renderAccounts()">
<option value="all">All</option>
<option value="Client">Active</option>
<option value="Potential Client">Prospect</option>
<option value="Past Client">Win-back</option>
</select>
</div>
<div class="filter-group">
<label>Industry</label>
<select id="filterIndustry" onchange="renderAccounts()"></select>
</div>
<div class="filter-group">
<label>Priority</label>
<select id="filterPriority" onchange="renderAccounts()">
<option value="all">All</option>
<option value="5">★★★★★ (5)</option>
<option value="4">★★★★ (4)</option>
<option value="3">★★★ (3)</option>
<option value="2">★★ (2)</option>
<option value="1">★ (1)</option>
</select>
</div>
<div class="filter-group">
<label>Sort</label>
<select id="sortBy" onchange="renderAccounts()">
<option value="priority-desc">Priority ↓</option>
<option value="priority-asc">Priority ↑</option>
<option value="name-asc">Name A-Z</option>
<option value="name-desc">Name Z-A</option>
<option value="ttm-desc">TTM Revenue ↓</option>
<option value="revenue-desc">Est. Revenue ↓</option>
</select>
</div>
<div class="filter-spacer"></div>
<div class="filter-group">
<input type="text" id="searchBox" placeholder="Search accounts..." oninput="renderAccounts()">
</div>
<div class="view-toggle">
<button class="active" onclick="setView('card',this)">Cards</button>
<button onclick="setView('table',this)">Table</button>
</div>
</div>

<div class="results-count" id="resultsCount"></div>
<div class="accounts-grid" id="accountsGrid"></div>
</div>

<div class="toast" id="toast">✓ CSV copied to clipboard</div>

<!-- ACCOUNT DETAIL MODAL -->
<!-- MEETING PREP OVERLAY -->
<div class="prep-overlay" id="prepOverlay" onclick="if(event.target===this)closePrepOverlay()">
  <div class="prep-doc">
    <div class="prep-doc-header">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#E31837,#00AEEF,#FFD100);display:flex;align-items:center;justify-content:center"><span style="font-size:1.1rem;font-weight:900;color:#fff;font-family:serif">Q</span></div>
        <div>
          <div style="font-size:1rem;font-weight:800;color:var(--text)" id="prepTitle">Meeting Prep</div>
          <div style="font-size:.7rem;color:var(--text2)" id="prepSubtitle">Generated by Quad Sales HQ</div>
        </div>
      </div>
      <button onclick="closePrepOverlay()" style="background:none;border:none;color:var(--text2);font-size:1.3rem;cursor:pointer">✕</button>
    </div>
    <div class="prep-doc-body" id="prepBody"></div>
    <div class="prep-actions">
      <button onclick="copyPrep()" style="background:linear-gradient(135deg,#E31837,#00AEEF);color:#fff;flex:1">📋 Copy to Clipboard</button>
      <button onclick="window.print()" style="background:var(--glass);color:var(--text);border:1px solid var(--border)">🖨️ Print</button>
      <button onclick="closePrepOverlay()" style="background:var(--glass);color:var(--text);border:1px solid var(--border)">Close</button>
    </div>
  </div>
</div>

<div class="acct-modal-overlay" id="acctModal" onclick="if(event.target===this)closeAcctModal()">
  <div class="acct-modal">
    <div class="acct-modal-header">
      <div style="display:flex;align-items:center;gap:16px">
        <img id="modalLogo" class="brand-logo-lg" src="" onerror="this.style.display='none'">
        <div>
          <h2 id="modalName" style="font-size:22px;margin-bottom:4px"></h2>
          <div id="modalSubtitle" style="font-size:13px;color:var(--text2)"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button onclick="generateMeetingPrep()" style="background:linear-gradient(135deg,#E31837,#00AEEF);color:#fff;border:none;padding:8px 16px;border-radius:10px;font-size:.75rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s;font-family:Inter,sans-serif" onmouseenter="this.style.transform='scale(1.05)'" onmouseleave="this.style.transform=''">🎤 Meeting Prep</button>
        <span id="saveIndicator" style="font-size:11px;color:var(--green);opacity:0;transition:.3s">✓ Saved</span>
        <button class="close-btn" onclick="closeAcctModal()">✕</button>
      </div>
    </div>
    <div class="acct-modal-body" id="modalBody"></div>
  </div>
</div>

function linkedinUrl(name){const slug=LINKEDIN[name];return slug?'https://www.linkedin.com/company/'+slug:'';};

// ===== NOTES & EDITS SYSTEM (localStorage) =====
const NOTES_KEY='quad_account_notes';
const EDITS_KEY='quad_account_edits';
function getNotes(){try{return JSON.parse(localStorage.getItem(NOTES_KEY))||{};}catch(e){return{};}}
function saveNotes(n){localStorage.setItem(NOTES_KEY,JSON.stringify(n));}
function getAccountNotes(name){return(getNotes()[name]||[]).sort((a,b)=>b.ts-a.ts);}
function hasNotes(name){const n=getNotes()[name];return n&&n.length>0;}
function getEdits(){try{return JSON.parse(localStorage.getItem(EDITS_KEY))||{};}catch(e){return{};}}
function saveEdits(e){localStorage.setItem(EDITS_KEY,JSON.stringify(e));}
function getAccountEdits(name){return getEdits()[name]||{};}
function hasEdits(name){const e=getEdits()[name];return e&&Object.keys(e).length>0;}
function saveField(name,field,value){const all=getEdits();if(!all[name])all[name]={};all[name][field]=value;all[name]._updated=Date.now();saveEdits(all);flashSaved();}
function getField(acct,field){const ed=getAccountEdits(acct.name);return ed[field]!==undefined?ed[field]:acct[field];}
function flashSaved(){const el=document.getElementById('saveIndicator');el.style.opacity='1';clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity='0';},1500);}
function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
// Short helpers that use currentModalAccount so we don't embed names in HTML attributes
function sf(field,value){if(currentModalAccount)saveField(currentModalAccount,field,value);}
function sfp(field,value){if(currentModalPipe)saveField('_pipe_'+currentModalPipe,field,value);}

let currentModalAccount=null;
let currentModalPipe=null;

function openAcctModal(name){
  const a=ACCOUNTS.find(x=>x.name===name);if(!a)return;
  currentModalAccount=name;
  const ed=getAccountEdits(name);
  const g=(f)=>ed[f]!==undefined?ed[f]:a[f];
  const logo=logoUrl(name);
  document.getElementById('modalLogo').src=logo;
  document.getElementById('modalLogo').style.display=logo?'block':'none';
  document.getElementById('modalName').textContent=a.name;
  const li=linkedinUrl(name);
  document.getElementById('modalSubtitle').innerHTML=`${g('city')}${g('state')?', '+g('state'):''} · ${g('industry')} · ${statusBadge(g('status'))}${li?' · <a href="'+li+'" target="_blank" rel="noopener" style="color:var(--cyan);text-decoration:none;font-size:12px">🔗 LinkedIn ↗</a>':''}`;

  const pipe=TOP_OPPS.find(p=>a.name.toLowerCase().includes(p.name.toLowerCase().split(' ')[0])||p.name.toLowerCase().includes(a.name.toLowerCase().split(' ')[0]));
  currentModalPipe=pipe?pipe.name:null;
  const pipeEdits=pipe?getAccountEdits('_pipe_'+pipe.name):{};
  const pg=(f,def)=>pipeEdits[f]!==undefined?pipeEdits[f]:def;

  // Build editable body
  let html='';

  // === ACCOUNT INFO ===
  html+=`<div class="acct-section"><div class="acct-section-title">Account Info</div>`;
  html+=`<div class="field-row">`;
  html+=`<div class="field-group"><div class="label">Status</div><select class="edit-select" onchange="sf('status',this.value)">

    <option value="Potential Client" ${g('status')==='Potential Client'?'selected':''}>🔵 Prospect</option>
    <option value="Past Client" ${g('status')==='Past Client'?'selected':''}>🟡 Win-back</option>
  </select></div>`;
  html+=`<div class="field-group"><div class="label">Priority</div><select class="edit-select" onchange="sf('priority',+this.value)">
    ${[5,4,3,2,1].map(n=>`<option value="${n}" ${g('priority')===n?'selected':''}>${'★'.repeat(n)}${'☆'.repeat(5-n)} (${n})</option>`).join('')}
  </select></div>`;
  html+=`</div>`;
  html+=`<div class="field-row">`;
  html+=`<div class="field-group"><div class="label">Est. Revenue</div><input class="edit-field sm" value="${escHtml(g('revenue'))}" onchange="sf('revenue',this.value)"></div>`;
  html+=`<div class="field-group"><div class="label">Employees</div><input class="edit-field sm" value="${escHtml(g('employees'))}" onchange="sf('employees',this.value)"></div>`;
  html+=`</div>`;
  html+=`<div class="field-row">`;
  html+=`<div class="field-group"><div class="label">Industry</div><input class="edit-field sm" value="${escHtml(g('industry'))}" onchange="sf('industry',this.value)"></div>`;
  html+=`<div class="field-group"><div class="label">City / State</div><div style="display:flex;gap:6px"><input class="edit-field sm" style="flex:2" value="${escHtml(g('city'))}" onchange="sf('city',this.value)" placeholder="City"><input class="edit-field sm" style="flex:1" value="${escHtml(g('state'))}" onchange="sf('state',this.value)" placeholder="ST"></div></div>`;
  html+=`</div>`;
  html+=`<div class="field-row">`;
  html+=`<div class="field-group"><div class="label">DM Likelihood</div><select class="edit-select" onchange="sf('dmLevel',this.value)">
    <option value="likely" ${g('dmLevel')==='likely'?'selected':''}>🟢 Highly Likely</option>
    <option value="possible" ${g('dmLevel')==='possible'?'selected':''}>🟡 Possible</option>
    <option value="unlikely" ${g('dmLevel')==='unlikely'?'selected':''}>🔴 Unlikely</option>
  </select></div>`;
  html+=`<div class="field-group"><div class="label">Recommended Product</div><input class="edit-field sm" value="${escHtml(g('product'))}" onchange="sf('product',this.value)"></div>`;
  html+=`</div>`;
  html+=`<div class="field-row">`;
  html+=`<div class="field-group"><div class="label">Case Study</div><input class="edit-field sm" value="${escHtml(g('caseStudy'))}" onchange="sf('caseStudy',this.value)"></div>`;
  html+=`<div class="field-group"><div class="label">Contact Name</div><input class="edit-field sm" value="${escHtml(ed.contactName||'')}" onchange="sf('contactName',this.value)" placeholder="Add contact name..."></div>`;
  html+=`</div>`;
  html+=`<div class="field-row">`;
  html+=`<div class="field-group"><div class="label">Contact Email</div><input class="edit-field sm" value="${escHtml(ed.contactEmail||'')}" onchange="sf('contactEmail',this.value)" placeholder="email@company.com"></div>`;

  html+=`</div>`;

  const currentLi=ed.linkedin||linkedinUrl(name)||'';

  html+=`</div>`;

  html+=`<div class="acct-section"><div class="acct-section-title">Description</div>`;
  html+=`<textarea class="edit-textarea" onchange="sf('description',this.value)">${escHtml(g('description'))}</textarea>`;

  html+=`<div class="acct-section"><div class="acct-section-title">Quad Strategy / Why Quad</div>`;

  // === CUSTOM FIELDS ===
  html+=`<div class="acct-section"><div class="acct-section-title">My Tracking</div>`;
  html+=`<div class="field-row">`;
  html+=`<div class="field-group"><div class="label">Deal Stage</div><select class="edit-select" onchange="sf('dealStage',this.value)">
    ${['—','Researching','Initial Outreach','Meeting Scheduled','Proposal Sent','Negotiating','Closed Won','Closed Lost','On Hold'].map(s=>`<option value="${s}" ${(ed.dealStage||'—')===s?'selected':''}>${s}</option>`).join('')}
  </select></div>`;
  html+=`<div class="field-group"><div class="label">Next Action</div><input class="edit-field sm" value="${escHtml(ed.nextAction||'')}" onchange="sf('nextAction',this.value)" placeholder="What's the next step?"></div>`;

  html+=`<div class="field-row">`;
  html+=`<div class="field-group"><div class="label">Timeline</div><input class="edit-field sm" value="${escHtml(ed.timeline||'')}" onchange="sf('timeline',this.value)" placeholder="e.g. Q2 2026, EOW 2/21"></div>`;

  html+=`<div class="field-row full">`;
  html+=`<div class="field-group"><div class="label">Status Update</div><textarea class="edit-textarea" style="min-height:50px" onchange="sf('statusUpdate',this.value)" placeholder="Latest status...">${escHtml(ed.statusUpdate||'')}</textarea></div>`;
  html+=`</div>`;
  html+=`</div>`;

  // === PIPELINE (if exists) ===
  if(pipe){
    html+=`<hr class="section-divider">`;
    html+=`<div class="acct-section"><div class="acct-section-title">🔥 Pipeline Deal — ${escHtml(pipe.name)}</div>`;
    html+=`<div class="field-row">`;
    html+=`<div class="field-group"><div class="label">Revenue</div><input class="edit-field sm" value="${escHtml(pg('rev',pipe.rev))}" onchange="sfp('rev',this.value)"></div>`;
    html+=`<div class="field-group"><div class="label">Reach</div><input class="edit-field sm" value="${escHtml(pg('reach',pipe.reach))}" onchange="sfp('reach',this.value)"></div>`;
    html+=`</div>`;
    html+=`<div class="field-row">`;
    html+=`<div class="field-group"><div class="label">Urgency</div><select class="edit-select" onchange="sfp('urgLabel',this.value)">
      ${['NOW','ACTIVE','RESET','RE-ENGAGE'].map(u=>`<option value="${u}" ${pg('urgLabel',pipe.urgLabel)===u?'selected':''}>${u}</option>`).join('')}

    html+=`<div class="field-row full">`;

function getIndustryBucket(ind){
  if(!ind) return 'default';
  const i=ind.toLowerCase();
  if(i.includes('financial')||i.includes('bank')||i.includes('credit')||i.includes('insurance')||i.includes('mortgage')||i.includes('debt')||i.includes('fintech'))return 'Financial Services';
  if(i.includes('retail')||i.includes('furniture')||i.includes('home'))return 'Retail';
  if(i.includes('cpg')||i.includes('food')||i.includes('beverage')||i.includes('beauty')||i.includes('skincare'))return 'CPG';
  if(i.includes('health')||i.includes('pharma')||i.includes('medical'))return 'Healthcare';
  if(i.includes('tech')||i.includes('saas')||i.includes('software'))return 'Technology';
  if(i.includes('telecom')||i.includes('isp')||i.includes('wireless')||i.includes('fiber'))return 'Telecom';
  return 'default';
}

function renderNotesInModal(name){
  const notes=getAccountNotes(name);
  const container=document.getElementById('modalNotes');
  if(!container)return;
  if(notes.length===0){
    container.innerHTML='<div style="font-size:12px;color:var(--text3);padding:8px 0">No notes yet. Add your first note below (Ctrl+Enter to save).</div>';
    return;
  }
  container.innerHTML=notes.map((n,i)=>{
    const d=new Date(n.ts);
    const dateStr=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    return `<div class="note-entry"><button class="note-del" data-name="${name.replace(/"/g,'&quot;')}" data-idx="${i}" onclick="deleteNote(this.dataset.name,+this.dataset.idx)">✕</button><div class="note-date">${dateStr}</div><div class="note-text">${escHtml(n.text)}</div></div>`;
  }).join('');
}

function addNote(){
  const input=document.getElementById('noteInput');
  const text=input.value.trim();
  if(!text||!currentModalAccount)return;
  const allNotes=getNotes();
  if(!allNotes[currentModalAccount])allNotes[currentModalAccount]=[];
  allNotes[currentModalAccount].push({text,ts:Date.now()});
  saveNotes(allNotes);
  input.value='';
  renderNotesInModal(currentModalAccount);
  flashSaved();
}

function deleteNote(name,idx){
  const allNotes=getNotes();
  const notes=(allNotes[name]||[]).sort((a,b)=>b.ts-a.ts);
  notes.splice(idx,1);
  allNotes[name]=notes;
  saveNotes(allNotes);
  renderNotesInModal(name);
}

function renderDashboard(){
  const total = ACCOUNTS.length;
  const clients = ACCOUNTS.filter(a=>a.status==='Client').length;
  const prospects = ACCOUNTS.filter(a=>a.status==='Potential Client').length;
  const past = ACCOUNTS.filter(a=>a.status==='Past Client').length;
  const p5 = ACCOUNTS.filter(a=>a.priority===5).length;
  const p4 = ACCOUNTS.filter(a=>a.priority===4).length;
  const p3 = ACCOUNTS.filter(a=>a.priority===3).length;
  // Pipeline totals from Top Opps
  let pipeRev=0,pipeReach=0;
  TOP_OPPS.forEach(o=>{const r=parseInt((o.rev||'').replace(/[^0-9]/g,''))||0;const rc=parseInt((o.reach||'').replace(/[^0-9]/g,''))||0;pipeRev+=r;pipeReach+=rc;});
  document.getElementById('dashboard').innerHTML = `
    <div class="stat-card cyan"><div class="stat-label">Total Accounts</div><div class="stat-value cyan">${total}</div><div class="stat-sub">${clients} active · ${prospects} prospects · ${past} win-back</div></div>
    <div class="stat-card green"><div class="stat-label">Pipeline Revenue</div><div class="stat-value green">$${pipeRev.toLocaleString()}</div><div class="stat-sub">Top Opportunities only</div></div>
    <div class="stat-card yellow"><div class="stat-label">Pipeline Reach</div><div class="stat-value yellow">$${pipeReach.toLocaleString()}</div><div class="stat-sub">2026 total reach · Top Opps</div></div>
    <div class="stat-card red"><div class="stat-label">High Priority (4-5)</div><div class="stat-value red">${p5+p4}</div><div class="stat-sub">${p5} critical · ${p4} high · ${p3} moderate</div></div>
  `;
}

function getFiltered(){
  const status = document.getElementById('filterStatus').value;
  const industry = document.getElementById('filterIndustry').value;
  const priority = document.getElementById('filterPriority').value;
  const search = document.getElementById('searchBox').value.toLowerCase();
  const sort = document.getElementById('sortBy').value;
  let list = ACCOUNTS.filter(a=>{
    if(status!=='all' && a.status!==status) return false;
    if(industry!=='all' && a.industry!==industry) return false;
    if(priority!=='all' && a.priority!==parseInt(priority)) return false;
    if(search && !a.name.toLowerCase().includes(search) && !a.city.toLowerCase().includes(search) && !a.state.toLowerCase().includes(search) && !a.industry.toLowerCase().includes(search)) return false;
    return true;
  });
  const [field,dir] = sort.split('-');
  list.sort((a,b)=>{
    let va,vb;
    if(field==='priority'){va=a.priority;vb=b.priority}
    else if(field==='name'){va=a.name;vb=b.name;return dir==='asc'?va.localeCompare(vb):vb.localeCompare(va)}
    else if(field==='ttm'){va=a.ttmGross;vb=b.ttmGross}
    else if(field==='revenue'){va=parseInt(a.revenue.replace(/[^0-9]/g,''))||0;vb=parseInt(b.revenue.replace(/[^0-9]/g,''))||0}
    return dir==='desc'?vb-va:va-vb;
  });
  return list;
}

function statusBadge(s){
  if(s==='Client') return '<span class="status-badge active">Active</span>';
  if(s==='Potential Client') return '<span class="status-badge prospect">Prospect</span>';
  return '<span class="status-badge winback">Win-back</span>';
}

function stars(n){
  return Array.from({length:5},(_, i)=>`<svg class="star ${i<n?'filled':''}" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`).join('');
}

function renderAccounts(){
  const list = getFiltered();
  document.getElementById('resultsCount').textContent = `Showing ${list.length} of ${ACCOUNTS.length} accounts`;
  const grid = document.getElementById('accountsGrid');
  grid.className = 'accounts-grid' + (currentView==='table'?' table-view':'');
  grid.innerHTML = list.map((a,i)=>{
    const exp = expandedId===a.name;
    const logo=logoUrl(a.name);
    const noteInd=hasNotes(a.name)?'has-notes':'';
    const editInd=hasEdits(a.name)?'has-edits':'';
    const ed=getAccountEdits(a.name);
    const safeN=a.name.replace(/'/g,"&#39;").replace(/"/g,"&quot;");
    const effPriority=ed.priority||a.priority;
    const effStatus=ed.status||a.status;
    return `<div class="account-card priority-${effPriority} ${noteInd} ${editInd}" data-acct="${safeN}" onclick="openAcctModal(this.dataset.acct)">
      <div class="card-header">
        <div class="card-header-left">${logo?`<img class="brand-logo" src="${logo}" onerror="this.classList.add('err')">`:''}<div><div class="company-name">${a.name}</div><div class="card-location">${ed.city||a.city}${(ed.state||a.state)?', '+(ed.state||a.state):''}</div></div></div>
        <div style="display:flex;align-items:center;gap:8px">${linkedinUrl(a.name)?'<a href="'+linkedinUrl(a.name)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--cyan);font-size:14px;text-decoration:none" title="LinkedIn">🔗</a>':''}${statusBadge(effStatus)}<div class="priority-stars">${stars(effPriority)}</div></div>
      </div>
      <div class="card-meta">
        <span class="meta-tag industry">${a.industry}</span>
        <span class="meta-tag revenue">${a.revenue}</span>
        <span class="meta-tag employees">${a.employees}</span>
        ${a.ttmGross>0?`<span class="meta-tag ttm">TTM: $${a.ttmGross.toLocaleString()}</span>`:''}
      </div>
      <div class="card-description">${a.description}</div>
    </div>`;
  }).join('');
}

function setView(v,btn){
  currentView=v;
  document.querySelectorAll('.view-toggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderAccounts();
}

function exportCSV(){
  const headers='Name,Status,City,State,Industry,Est Revenue,Employees,TTM Gross,TTM MFG,Priority,Direct Mail,Product,Case Study,Description,Quad Fit';
  const rows=ACCOUNTS.map(a=>[a.name,a.status,a.city,a.state,a.industry,a.revenue,a.employees,a.ttmGross,a.ttmMfg||0,a.priority,a.dmLevel,a.product,a.caseStudy,'"'+a.description.replace(/"/g,'""')+'"','"'+a.quadFit.replace(/"/g,'""')+'"'].join(','));
  navigator.clipboard.writeText(headers+'\n'+rows.join('\n'));
  const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);
}
